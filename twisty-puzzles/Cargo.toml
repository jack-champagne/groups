[package]
name = "twisty-puzzles"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Models of WCA-recognized twisty puzzles built on the `groups` algebra crate."

[dependencies]
groups = { path = ".." }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "puzzle_validation"
harness = false

